<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Finance Reports</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head><body class="bg-light"><div class="container-fluid my-4 px-4"><div class="d-flex justify-content-between mb-3"><h3>Financial Reports</h3><div><a th:href="@{/payment/transactions}" class="btn btn-primary">Transactions</a> <a th:href="@{/admin/dashboard}" class="btn btn-outline-secondary">Dashboard</a></div></div><form class="card border-0 shadow-sm p-3 mb-4" method="get" th:action="@{/payment/reports}"><div class="row g-2 align-items-end"><div class="col-md-3"><label>From</label><input class="form-control" type="date" name="startDate" th:value="${startDate}"></div><div class="col-md-3"><label>To</label><input class="form-control" type="date" name="endDate" th:value="${endDate}"></div><div class="col-md-2"><button class="btn btn-success w-100">Apply</button></div><div class="col-md-4 text-end"><a class="btn btn-outline-dark" th:href="@{/payment/reports/export(startDate=${startDate},endDate=${endDate})}">Export CSV</a><button type="button" onclick="window.print()" class="btn btn-outline-secondary">Print</button></div></div></form>
<div class="row g-3 mb-4"><div class="col-md-3"><div class="card border-0 shadow-sm p-3"><small>Net Revenue</small><h3>Rs. <span th:text="${totalRevenue}"></span></h3></div></div><div class="col-md-3"><div class="card border-0 shadow-sm p-3"><small>Payments Shown</small><h3 th:text="${#lists.size(payments)}"></h3></div></div><div class="col-md-3"><div class="card border-0 shadow-sm p-3"><small>Total Orders</small><h3 th:text="${totalOrders}"></h3></div></div><div class="col-md-3"><div class="card border-0 shadow-sm p-3"><small>Total Customers</small><h3 th:text="${totalCustomers}"></h3></div></div></div>
<div class="row g-4"><div class="col-lg-8"><div class="card border-0 shadow-sm"><div class="table-responsive"><table class="table align-middle mb-0"><thead class="table-dark"><tr><th>Payment</th><th>Order</th><th>Amount</th><th>Method</th><th>Status</th><th>Date</th></tr></thead><tbody><tr th:each="p : ${payments}"><td th:text="${p.paymentId}"></td><td th:text="${'#' + p.order.orderId}"></td><td th:text="${'Rs. ' + p.amount}"></td><td th:text="${p.paymentMethod.displayName}"></td><td th:text="${p.status}"></td><td th:text="${#temporals.format(p.paidAt,'dd MMM yyyy HH:mm')}"></td></tr><tr th:if="${payments.isEmpty()}"><td colspan="6" class="text-center py-4">No transactions.</td></tr></tbody></table></div></div></div><div class="col-lg-4"><div class="card border-0 shadow-sm p-3"><h5>Revenue by Method</h5><div th:each="e : ${revenueBreakdown}" class="d-flex justify-content-between border-bottom py-2"><span th:text="${e.key}"></span><b>Rs. <span th:text="${e.value}"></span></b></div></div><div class="card border-0 shadow-sm p-3 mt-3"><h5>Top Selling Items</h5><div th:each="e : ${topItems}" class="d-flex justify-content-between py-1"><span th:text="${e.key}"></span><span th:text="${e.value}"></span></div></div></div></div></div></body></html>
