<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"><title>Reports - ExpressMeal Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <style>
    *{font-family:'Poppins',sans-serif;}
    body{background:#f6f5fa;}
    .navbar{background:#1c1c1e;}
    .brand span{color:#8b5cf6;}
    .card{border:none; border-radius:16px;}
    .metric{background:#fff; border-radius:16px; padding:22px; text-align:center; box-shadow:0 4px 14px rgba(0,0,0,.05); height:100%;}
    .metric h2{color:#8b5cf6; font-weight:700;}
    .btn-purple{background:#8b5cf6; border:none; color:#fff; border-radius:50px; font-weight:600;}
    .btn-purple:hover{background:#7c3aed; color:#fff;}
    @media print {
      .no-print { display: none !important; }
      body { background: #fff !important; }
    }
  </style>
</head>
<body>
<nav class="navbar navbar-dark px-4 py-3 no-print">
  <span class="navbar-brand brand fw-bold"><i class="bi bi-graph-up-arrow me-1"></i>Express<span>Meal</span> Reports</span>
  <a th:href="@{/admin/dashboard}" class="btn btn-outline-light btn-sm rounded-pill">Back to Dashboard</a>
</nav>

<div class="container my-5">
  <h3 class="mb-4">Reports</h3>

  <!-- Date filter -->
  <form th:action="@{/payment/reports}" method="get" class="row g-2 align-items-end mb-4 no-print">
    <div class="col-auto">
      <label class="form-label small fw-semibold mb-1">From</label>
      <input type="date" name="startDate" th:value="${startDate}" class="form-control">
    </div>
    <div class="col-auto">
      <label class="form-label small fw-semibold mb-1">To</label>
      <input type="date" name="endDate" th:value="${endDate}" class="form-control">
    </div>
    <div class="col-auto">
      <button type="submit" class="btn btn-purple">Apply Filter</button>
    </div>
    <div class="col-auto">
      <a th:href="@{/payment/reports}" class="btn btn-outline-secondary">Clear</a>
    </div>
    <div class="col-auto ms-auto">
      <a th:href="@{/payment/reports/export(startDate=${startDate}, endDate=${endDate})}" class="btn btn-outline-dark">
        <i class="bi bi-download"></i> Export CSV
      </a>
      <button type="button" onclick="window.print()" class="btn btn-outline-dark">
        <i class="bi bi-printer"></i> Print / Save PDF
      </button>
    </div>
  </form>

  <!-- Summary metrics -->
  <div class="row g-3 mb-4">
    <div class="col-md-3 col-6">
      <div class="metric"><p class="text-muted small mb-1">Revenue (filtered)</p><h2>Rs. <span th:text="${totalRevenue}"></span></h2></div>
    </div>
    <div class="col-md-3 col-6">
      <div class="metric"><p class="text-muted small mb-1">Total Orders</p><h2 th:text="${totalOrders}"></h2></div>
    </div>
    <div class="col-md-3 col-6">
      <div class="metric"><p class="text-muted small mb-1">Total Customers</p><h2 th:text="${totalCustomers}"></h2></div>
    </div>
    <div class="col-md-3 col-6">
      <div class="metric"><p class="text-muted small mb-1">Payments Shown</p><h2 th:text="${#lists.size(payments)}"></h2></div>
    </div>
  </div>

  <div class="row g-4">
    <div class="col-md-8">
      <h5 class="mb-3">Payment History</h5>
      <div class="card p-0 shadow-sm">
        <table class="table mb-0">
          <thead class="table-light"><tr><th class="ps-3">Order #</th><th>Amount</th><th>Method</th><th>Status</th><th class="pe-3">Date</th></tr></thead>
          <tbody>
          <tr th:each="p : ${payments}">
            <td class="ps-3" th:text="${p.order.orderId}"></td>
            <td th:text="'Rs. ' + ${p.amount}"></td>
            <td th:text="${p.method}"></td>
            <td th:text="${p.status}"></td>
            <td class="pe-3" th:text="${#temporals.format(p.paidAt, 'dd MMM yyyy, HH:mm')}"></td>
          </tr>
          <tr th:if="${payments.isEmpty()}"><td colspan="5" class="text-center text-muted py-4">No payments found for this period.</td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <div class="col-md-4">
      <h5 class="mb-3">Top-Selling Items</h5>
      <div class="card p-3 shadow-sm">
        <table class="table table-borderless mb-0">
          <tbody>
          <tr th:each="entry : ${topItems}">
            <td th:text="${entry.key}"></td>
            <td class="text-end fw-semibold" th:text="${entry.value} + ' sold'"></td>
          </tr>
          <tr th:if="${topItems.isEmpty()}"><td class="text-muted small">No sales data yet.</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
</body>
</html>
