<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Payment Failed - ExpressMeal</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <style>
        * { font-family: 'Poppins', sans-serif; }
        body { background: #f7f5f2; }
        .card { border: none; border-radius: 16px; }
        .btn-orange { background: #FF6B35; border: none; color: #fff; border-radius: 50px; font-weight: 600; }
        .btn-orange:hover { background: #e85a2a; color: #fff; }
    </style>
</head>
<body>
<div class="container my-5" style="max-width:520px;">
    <div class="card p-4 shadow-sm text-center">
        <i class="bi bi-x-circle-fill text-danger mb-2" style="font-size: 3.2rem;"></i>
        <h4 class="fw-bold mb-1">Payment Not Completed</h4>
        
        <div class="alert alert-danger my-3 small text-start" th:if="${payment != null and payment.message != null}">
            <i class="bi bi-exclamation-triangle-fill me-1"></i> <span th:text="${payment.message}"></span>
        </div>
        <div class="alert alert-danger my-3 small text-start" th:if="${error != null}">
            <i class="bi bi-exclamation-triangle-fill me-1"></i> <span th:text="${error}"></span>
        </div>

        <div class="border rounded-3 p-3 bg-light text-start mb-3" th:if="${order != null}">
            <div class="d-flex justify-content-between mb-2">
                <span class="text-muted small">Order ID:</span>
                <span class="fw-semibold">#<span th:text="${order.orderId}"></span></span>
            </div>
            <div class="d-flex justify-content-between mb-2" th:if="${payment != null and payment.transactionId != null}">
                <span class="text-muted small">Transaction ID:</span>
                <span class="fw-semibold font-monospace small" th:text="${payment.transactionId}"></span>
            </div>
            <div class="d-flex justify-content-between mb-2" th:if="${payment != null and payment.paymentMethod != null}">
                <span class="text-muted small">Method:</span>
                <span class="fw-semibold" th:text="${payment.paymentMethod.displayName}"></span>
            </div>
            <div class="d-flex justify-content-between">
                <span class="text-muted small">Amount:</span>
                <span class="fw-bold text-dark">Rs. <span th:text="${order.totalAmount}"></span></span>
            </div>
        </div>

        <p class="text-muted small mb-4">No funds were deducted. Your order is still reserved as PENDING and you can retry payment anytime.</p>

        <div class="d-grid gap-2">
            <a th:if="${order != null}" th:href="@{/payment/checkout/{orderId}(orderId=${order.orderId})}" class="btn btn-orange py-2">
                <i class="bi bi-arrow-clockwise me-1"></i> Try Again / Change Method
            </a>
            <a th:href="@{/customer/dashboard}" class="btn btn-outline-secondary rounded-pill py-2">
                Back to Dashboard
            </a>
        </div>
    </div>
</div>
</body>
</html>
