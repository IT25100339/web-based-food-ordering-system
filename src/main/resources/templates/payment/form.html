<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Make Online Payment</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f4; margin: 0; }
        main { max-width: 560px; margin: 48px auto; padding: 28px; background: white; border-radius: 8px; }
        label { display: block; font-weight: bold; margin-top: 16px; }
        input, select { box-sizing: border-box; width: 100%; padding: 10px; margin-top: 6px; }
        button { background: #ff5722; color: white; border: 0; padding: 11px 18px; margin-top: 22px; cursor: pointer; }
        .error { color: #b00020; font-size: .9em; }
        .hint { color: #555; font-size: .9em; }
    </style>
</head>
<body>
<main>
    <h1>Make Online Payment</h1>
    <p class="hint">This is a test payment form. Enter <strong>DECLINE</strong> in the test details to simulate a declined transaction.</p>
    <form th:action="@{/payments}" th:object="${paymentRequest}" method="post">
        <label for="orderId">Order ID</label>
        <input id="orderId" type="text" th:field="*{orderId}" placeholder="Example: ORD-1001">
        <p class="error" th:if="${#fields.hasErrors('orderId')}" th:errors="*{orderId}"></p>

        <label for="amount">Amount due</label>
        <input id="amount" type="number" min="0.01" step="0.01" th:field="*{amount}" placeholder="0.00">
        <p class="error" th:if="${#fields.hasErrors('amount')}" th:errors="*{amount}"></p>

        <label for="paymentMethod">Payment method</label>
        <select id="paymentMethod" th:field="*{paymentMethod}">
            <option value="">Select a method</option>
            <option th:each="method : ${paymentMethods}" th:value="${method}" th:text="${method.displayName}"></option>
        </select>
        <p class="error" th:if="${#fields.hasErrors('paymentMethod')}" th:errors="*{paymentMethod}"></p>

        <label for="testPaymentDetails">Test payment details</label>
        <input id="testPaymentDetails" type="text" th:field="*{testPaymentDetails}" placeholder="Example: 4111 1111 1111 1111">
        <p class="error" th:if="${#fields.hasErrors('testPaymentDetails')}" th:errors="*{testPaymentDetails}"></p>

        <button type="submit">Pay now</button>
    </form>
</main>
</body>
</html>
