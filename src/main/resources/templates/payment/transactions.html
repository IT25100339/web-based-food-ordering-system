<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Finance Transactions</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head><body class="bg-light"><div class="container-fluid my-4 px-4"><div class="d-flex justify-content-between align-items-center mb-3"><div><h3 class="fw-bold mb-0">Payment & Finance Transactions</h3><small class="text-muted">Retrieve, verify, reconcile and manage payment records.</small></div><a th:href="@{/admin/dashboard}" class="btn btn-outline-secondary">Admin Dashboard</a></div>
<form class="card border-0 shadow-sm p-3 mb-3" method="get" th:action="@{/payment/transactions}"><div class="row g-2"><div class="col-md-3"><input class="form-control" name="q" th:value="${q}" placeholder="Order, transaction, customer..."></div><div class="col-md-2"><input class="form-control" type="date" name="startDate" th:value="${startDate}"></div><div class="col-md-2"><input class="form-control" type="date" name="endDate" th:value="${endDate}"></div><div class="col-md-2"><select class="form-select" name="status"><option value="">All statuses</option><option th:each="s : ${statuses}" th:value="${s}" th:selected="${s == selectedStatus}" th:text="${s}"></option></select></div><div class="col-md-2"><select class="form-select" name="method"><option value="">All methods</option><option th:each="m : ${methods}" th:value="${m}" th:selected="${m == selectedMethod}" th:text="${m.displayName}"></option></select></div><div class="col-md-1"><button class="btn btn-primary w-100">Filter</button></div></div></form>
<div class="card border-0 shadow-sm"><div class="table-responsive"><table class="table table-hover align-middle mb-0"><thead class="table-dark"><tr><th>ID</th><th>Order</th><th>Customer</th><th>Amount</th><th>Method</th><th>Status</th><th>Verified</th><th>Date</th><th></th></tr></thead><tbody><tr th:each="p : ${payments}"><td th:text="${p.paymentId}"></td><td th:text="${'#' + p.order.orderId}"></td><td th:text="${p.order.customer.name}"></td><td th:text="${'Rs. ' + p.amount}"></td><td th:text="${p.paymentMethod.displayName}"></td><td><span class="badge" th:classappend="${p.status.name() == 'SUCCESS' ? ' text-bg-success' : (p.status.name() == 'REFUNDED' ? ' text-bg-warning' : ' text-bg-danger')}" th:text="${p.status}"></span></td><td th:text="${p.verified ? 'Yes' : 'No'}"></td><td th:text="${#temporals.format(p.paidAt,'dd MMM yyyy HH:mm')}"></td><td><a class="btn btn-sm btn-outline-primary" th:href="@{/payment/transactions/{id}(id=${p.paymentId})}">View</a></td></tr><tr th:if="${payments.isEmpty()}"><td colspan="9" class="text-center py-4 text-muted">No matching transactions.</td></tr></tbody></table></div></div></div></body></html>
