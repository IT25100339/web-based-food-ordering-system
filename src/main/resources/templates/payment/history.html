<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Payment History</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head><body class="bg-light"><div class="container my-5"><div class="d-flex justify-content-between mb-3"><h3>Payment History</h3><a th:href="@{/customer/dashboard}" class="btn btn-outline-secondary">Dashboard</a></div><div class="card border-0 shadow-sm"><div class="table-responsive"><table class="table align-middle mb-0"><thead class="table-light"><tr><th>Order</th><th>Transaction</th><th>Method</th><th>Amount</th><th>Status</th><th>Date</th><th></th></tr></thead><tbody><tr th:each="p : ${payments}"><td th:text="${'#' + p.order.orderId}"></td><td class="font-monospace small" th:text="${p.transactionId}"></td><td th:text="${p.paymentMethod.displayName}"></td><td th:text="${'Rs. ' + p.amount}"></td><td th:text="${p.status}"></td><td th:text="${#temporals.format(p.paidAt,'dd MMM yyyy HH:mm')}"></td><td><a th:href="@{/payment/invoice/{id}(id=${p.order.orderId})}" class="btn btn-sm btn-outline-primary">Invoice</a></td></tr><tr th:if="${payments.isEmpty()}"><td colspan="7" class="text-center py-4 text-muted">No payment transactions yet.</td></tr></tbody></table></div></div></div></body></html>
