<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Invoice - ExpressMeal</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body class="bg-light"><div class="container my-5" style="max-width:650px"><div class="card border-0 shadow-sm p-4 rounded-4"><div class="text-center"><h3 class="fw-bold">ExpressMeal Invoice</h3><p class="text-success fw-semibold" th:text="${payment.status == T(com.foodorderingsystem.payment.entity.PaymentStatus).REFUNDED ? 'Payment refunded' : 'Payment successful'}"></p></div>
<div class="row g-2 small"><div class="col-6">Invoice No.</div><div class="col-6 text-end fw-semibold" th:text="${invoice != null ? invoice.invoiceNo : 'N/A'}"></div><div class="col-6">Receipt No.</div><div class="col-6 text-end" th:text="${receipt != null ? receipt.receiptNumber : 'N/A'}"></div><div class="col-6">Order</div><div class="col-6 text-end" th:text="${'#' + order.orderId}"></div><div class="col-6">Transaction</div><div class="col-6 text-end font-monospace" th:text="${payment.transactionId}"></div><div class="col-6">Method</div><div class="col-6 text-end" th:text="${payment.paymentMethod.displayName}"></div><div class="col-6">Food subtotal</div><div class="col-6 text-end">Rs. <span th:text="${payment.orderAmount}"></span></div><div class="col-6">Delivery fee</div><div class="col-6 text-end">Rs. <span th:text="${payment.deliveryFee}"></span></div><div class="col-6">Processing fee</div><div class="col-6 text-end">Rs. <span th:text="${payment.processingFee}"></span></div></div><hr><div class="d-flex justify-content-between fs-5 fw-bold"><span>Total</span><span>Rs. <span th:text="${payment.amount}"></span></span></div>
<div class="alert alert-warning mt-3 small" th:if="${payment.paymentMethod.name() == 'CASH_ON_DELIVERY'}">Cash on delivery: payment is collected by the rider when the order is delivered.</div><div class="alert alert-info mt-3 small" th:if="${refund != null}">Refund: Rs. <span th:text="${refund.amount}"></span> — <span th:text="${refund.refundStatus}"></span></div>
<div class="d-grid gap-2 mt-4"><a class="btn btn-success" th:href="@{/order/track/{id}(id=${order.orderId})}">Track order</a><a class="btn btn-outline-secondary" th:href="@{/payment/history}">Payment history</a><a class="btn btn-outline-secondary" th:href="@{/customer/dashboard}">Dashboard</a></div></div></div></body></html>
