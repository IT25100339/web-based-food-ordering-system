<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"><title>My Profile - ExpressMeal</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    *{font-family:'Poppins',sans-serif;}
    body{background:#f7f8fa;}
    .navbar{background:#1c1c1e;}
    .brand span{color:#FF6B35;}
    .btn-orange{background:#FF6B35; border:none; color:#fff; border-radius:50px; font-weight:600;}
    .btn-orange:hover{background:#e85a2a; color:#fff;}
    .card{border:none; border-radius:16px;}
    .form-control{border-radius:10px;}
    .is-invalid{border-color:#dc3545;}
  </style>
</head>
<body>
<nav class="navbar navbar-dark px-4 py-3">
  <span class="navbar-brand brand fw-bold">Express<span>Meal</span></span>
  <div>
    <a th:href="@{/customer/dashboard}" class="btn btn-outline-light btn-sm rounded-pill me-2">Back to Dashboard</a>
    <a th:href="@{/logout}" class="btn btn-orange btn-sm">Logout</a>
  </div>
</nav>

<div class="container my-5" style="max-width:520px;">
  <h4 class="mb-4">My Profile</h4>

  <p th:if="${success}" class="alert alert-success py-2 small">Profile updated successfully.</p>

  <div class="card p-4 shadow-sm">
    <form th:action="@{/customer/profile/update}" method="post">
      <div class="mb-3">
        <label class="form-label small fw-semibold">Full Name</label>
        <input type="text" name="name" class="form-control" th:classappend="${nameError} ? 'is-invalid' : ''"
               th:value="${customer.name}" required>
        <div class="text-danger small mt-1" th:if="${nameError}" th:text="${nameError}"></div>
      </div>
      <div class="mb-3">
        <label class="form-label small fw-semibold">Email</label>
        <input type="email" class="form-control" th:value="${customer.email}" readonly disabled>
        <small class="text-muted">Email can't be changed.</small>
      </div>
      <div class="mb-3">
        <label class="form-label small fw-semibold">Phone</label>
        <input type="text" name="phone" class="form-control" th:classappend="${phoneError} ? 'is-invalid' : ''"
               th:value="${customer.phone}" placeholder="9-15 digits, no spaces" required>
        <div class="text-danger small mt-1" th:if="${phoneError}" th:text="${phoneError}"></div>
      </div>
      <div class="mb-4">
        <label class="form-label small fw-semibold">Delivery Address</label>
        <textarea name="address" class="form-control" rows="3" th:text="${customer.address}" placeholder="Your default delivery address"></textarea>
      </div>
      <button type="submit" class="btn btn-orange w-100">Save Changes</button>
    </form>
  </div>
</div>
</body>
</html>
