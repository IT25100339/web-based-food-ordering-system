<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title th:text="${isNew} ? 'Add Customer - ExpressMeal Admin' : 'Edit Customer - ExpressMeal Admin'"></title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <style>
    *{font-family:'Poppins',sans-serif;}
    body{background:#f6f5fa;}
    .navbar{background:#1c1c1e;}
    .brand span{color:#8b5cf6;}
    .btn-purple{background:#8b5cf6; border:none; color:#fff; border-radius:50px; font-weight:600;}
    .btn-purple:hover{background:#7c3aed; color:#fff;}
    .card{border:none; border-radius:16px;}
    .form-control:focus{border-color:#8b5cf6; box-shadow:0 0 0 3px rgba(139,92,246,.15);}
  </style>
</head>
<body>
<nav class="navbar navbar-dark px-4 py-3">
  <span class="navbar-brand brand fw-bold"><i class="bi bi-shield-lock-fill me-1"></i>Express<span>Meal</span> Admin</span>
  <a th:href="@{/admin/customers}" class="btn btn-outline-light btn-sm rounded-pill"><i class="bi bi-arrow-left"></i> Customers</a>
</nav>

<div class="container my-5" style="max-width:520px;">
  <h3 class="mb-4" th:text="${isNew} ? 'Add new customer' : 'Edit customer'"></h3>

  <p th:if="${emailError}" class="alert alert-danger py-2 small" th:text="${emailError}"></p>
  <p th:if="${error}" class="alert alert-danger py-2 small" th:text="${error}"></p>

  <div class="card p-4 shadow-sm">
    <!-- Create: POST /admin/customers/save (binds full Customer + validation incl. password rule) -->
    <form th:if="${isNew}" th:action="@{/admin/customers/save}" th:object="${customer}" method="post">
      <div class="mb-3">
        <label class="form-label">Full name</label>
        <input type="text" class="form-control" th:field="*{name}" required>
        <div class="text-danger small mt-1" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
      </div>
      <div class="mb-3">
        <label class="form-label">Email</label>
        <input type="email" class="form-control" th:field="*{email}" required>
        <div class="text-danger small mt-1" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
      </div>
      <div class="mb-3">
        <label class="form-label">Password</label>
        <input type="password" class="form-control" th:field="*{password}" required>
        <div class="text-danger small mt-1" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
        <small class="text-muted">At least 8 characters, with a number and a special character.</small>
      </div>
      <div class="mb-3">
        <label class="form-label">Phone</label>
        <input type="text" class="form-control" th:field="*{phone}" placeholder="9-15 digits">
        <div class="text-danger small mt-1" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></div>
      </div>
      <div class="mb-3">
        <label class="form-label">Address</label>
        <textarea class="form-control" rows="2" th:field="*{address}"></textarea>
      </div>
      <div class="d-flex gap-2">
        <a th:href="@{/admin/customers}" class="btn btn-outline-secondary flex-grow-1">Cancel</a>
        <button type="submit" class="btn btn-purple flex-grow-1"><i class="bi bi-check2"></i> Add customer</button>
      </div>
    </form>

    <!-- Edit: POST /admin/customers/update/{id} - no password field (admin doesn't reset it here) -->
    <form th:unless="${isNew}" th:action="@{/admin/customers/update/{id}(id=${customer.customerId})}" method="post">
      <div class="mb-3">
        <label class="form-label">Full name</label>
        <input type="text" name="name" class="form-control" th:value="${customer.name}" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Email</label>
        <input type="email" name="email" class="form-control" th:value="${customer.email}" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Phone</label>
        <input type="text" name="phone" class="form-control" th:value="${customer.phone}" placeholder="9-15 digits">
      </div>
      <div class="mb-3">
        <label class="form-label">Address</label>
        <textarea name="address" class="form-control" rows="2" th:text="${customer.address}"></textarea>
      </div>
      <div class="d-flex gap-2">
        <a th:href="@{/admin/customers}" class="btn btn-outline-secondary flex-grow-1">Cancel</a>
        <button type="submit" class="btn btn-purple flex-grow-1"><i class="bi bi-check2"></i> Save changes</button>
      </div>
    </form>
  </div>
</div>
</body>
</html>
